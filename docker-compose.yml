# Run N copies of the API behind a load balancer (nginx):
#   docker compose up --build -d --scale api=1     # 1 container
#   docker compose up -d --scale api=2             # 2 containers
#   docker compose up -d --scale api=3             # 3 containers
# The app is then available on http://localhost:8080
# Stop everything with:  docker compose down

services:
  api:
    build: .
    expose:
      - "8000"
    environment:
      - PORT=8000

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
