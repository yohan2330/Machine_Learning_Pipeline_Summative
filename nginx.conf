# Load balancer: spreads the requests over all the "api" containers.
# Docker's DNS (127.0.0.11) returns the address of every api container,
# and nginx uses them one after the other (round-robin).
server {
    listen 80;
    client_max_body_size 50m;

    resolver 127.0.0.11 valid=5s ipv6=off;

    location / {
        set $upstream http://api:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}
